services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: intervyou_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intervyou_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Redis Service
  redis:
    image: redis:7-alpine
    container_name: intervyou_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. LiveKit WebRTC Server
  livekit:
    image: livekit/livekit-server:v1.6
    container_name: intervyou_livekit
    restart: always
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50010:50000-50010/udp"
    environment:
      LIVEKIT_KEYS: "devkey: secretsecretsecretsecretsecretsecretsecret"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml

volumes:
  postgres_data:
  redis_data: